# SSH de la RGB20S: solo el usuario alarm, solo con clave.
# customize.sh habilita el login por contraseña SOLO si al armar la imagen no hubo authorized_keys
# (ver 20-rgb20s-password.conf en la imagen).
PermitRootLogin no
AllowUsers alarm
PasswordAuthentication no
KbdInteractiveAuthentication no
UseDNS no
