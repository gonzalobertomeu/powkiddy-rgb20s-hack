# Configuración de la RGB20S editable desde la Mac (partición FAT RGB20S_BOOT, /boot/rgb20s.conf).
# La leen los servicios rgb20s-* al arrancar. Formato: VARIABLE=valor, sin espacios.

# Rol del USB-C:
#   device  gadget USB hacia la Mac: red (NCM) + puerto serie (ACM). Por defecto.
#   host    la consola es host: tethering de Android, adaptador USB-Ethernet, pendrive, MIDI.
USB_ROLE=device

# Función de red del gadget: ncm (recomendada en Linux), ecm, rndis (Windows viejo)
USB_NET=ncm

# IP de la consola en la red USB del gadget. La Mac recibe una IP por DHCP (pool .10-.20).
USB_ADDRESS=10.55.0.1/24

# Logs de arranque en /boot/logs/ (yes/no)
BOOT_LOGS=yes

# Agrandar la partición raíz al tamaño de la tarjeta en el próximo arranque (yes/no).
# Desactivado por defecto: activarlo recién cuando el primer arranque funcione.
GROW_ROOT=no
