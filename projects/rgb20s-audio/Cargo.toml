[package]
name = "rgb20s-audio"
version = "0.1.0"
edition = "2024"

[dependencies]
# Mixer y controles de la tarjeta (libasound, la misma que usa el groovebox vía cpal)
alsa = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
# Modo y formato del estado publicado (compartido con el launcher y el groovebox)
rgb20s-common = { path = "../rgb20s-common" }
