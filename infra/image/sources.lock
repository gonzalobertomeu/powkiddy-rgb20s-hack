# Fuentes fijadas de la imagen Arch Linux ARM para la RGB20S.
# Lo leen infra/image/scripts/*.sh. Cambiar una versión acá = volver a descargar y reconstruir.
# Ver docs/firmware/arch-linux-arm.md y docs/decisions/0009..0012.

# --- Kernel: mainline, misma versión que usa ROCKNIX para RK3326 (packages/linux/package.mk) ---
LINUX_VERSION=7.1.2
LINUX_URL=https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.2.tar.xz
# Mismo valor en ROCKNIX (PKG_SHA256) y en https://cdn.kernel.org/pub/linux/kernel/v7.x/sha256sums.asc
LINUX_SHA256=37198c93727be247c9fb5309bb86cd5e496c61e5322cd8c4eca9476bb0b5883f

# --- U-Boot: mainline, misma versión que ROCKNIX (devices/RK3326/packages/u-boot/package.mk) ---
UBOOT_VERSION=v2025.10
UBOOT_URL=https://github.com/u-boot/u-boot/archive/refs/tags/v2025.10.tar.gz
UBOOT_SHA256=5414ee86562abc5ed524c6dc5e092511ad281441020a88e7027de6e83fd16116

# --- rkbin: blobs de Rockchip (DDR init, miniloader, BL31) y herramientas de empaquetado ---
