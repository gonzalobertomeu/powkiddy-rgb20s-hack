# --- Arch Linux ARM: tarball genérico aarch64 ---
# El "latest" cambia sin aviso y ALARM no guarda versiones viejas: se verifica md5 (publicado)
# y firma GPG, y el sha256 del que se usó queda en infra/downloads/alarm/USED.sha256.
ALARM_URL=http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
# Clave "Arch Linux ARM Build System" (https://archlinuxarm.org/about/package-signing)
ALARM_KEY_FPR=68B3537F39A313B3E574D06777193F152BDBE6A6
