# hash de objeto git (git hash-object), que lo ata al commit, y con sha256.
RKBIN_COMMIT=3e288fe814e059dd06833495f845cab04ac20a5c
RKBIN_BASE=https://raw.githubusercontent.com/rockchip-linux/rkbin
# formato: <ruta en rkbin> <sha1 de objeto git>
RKBIN_FILES="
bin/rk33/rk3326_ddr_333MHz_v2.12.bin 6d58776c090631eb3bcd3c93abf43b008ae78978
bin/rk33/rk3326_miniloader_v1.40.bin 24c15c783b7d0bba76b83d736400091032803153
bin/rk33/rk3326_bl31_v1.37.elf 28ad722d7d38a66e3fdfb068059791741f0dfb73
tools/loaderimage ff56cf7cc9afefdbffb7397afa5fc8f073585f8f
tools/trust_merger 3c748eac864f1016c6edde07696cf68c639cec12
LICENSE f62330155a581ea22aed1c41ce9ca32eed23164f
"

# --- ROCKNIX: DTS, parches y driver de panel copiados en projects/linux-image/kernel/rocknix/ ---
ROCKNIX_COMMIT=61690fa8042acf631922deb2c80e8574e96958d2

# --- rocknix-joypad: driver del joypad (rocknix-singleadc-joypad), módulo externo ---
